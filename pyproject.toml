[project]
name = "algotrade-ai"
version = "0.1.0"
description = "Observation-first trading platform foundation; live execution unavailable"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "protobuf>=6.33.5,<7",
  "websockets>=16,<17",
  "google-auth-oauthlib>=1.2,<2",
  "cryptography>=46,<51",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "types-protobuf>=6,<7",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/vendor"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app"]

# protoc's generated Mapping annotations omit generic arguments. Keep strict app checks.
[[tool.mypy.overrides]]
module = "backend.vendor.upstox.MarketDataFeed_pb2"
disallow_any_generics = false
